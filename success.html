<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to Soma</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body>
  <main class="wrap narrow center" style="padding:96px 16px">
    <p class="eyebrow">Payment received</p>
    <h1 id="title">Thank you! 🎉</h1>
    <p class="lede" id="body" style="margin:0 auto 28px">Your purchase is complete. A receipt is on its way to your inbox.</p>
    <a class="btn btn-primary btn-lg" id="cta" href="index.html#generator">Start invoicing</a>
  </main>
  <script>
    const plan = new URLSearchParams(location.search).get("plan");
    const set = (k, v) => { try { localStorage.setItem("soma:" + k, JSON.stringify(v)); } catch {} };
    if (plan === "pro" || plan === "business") {
      set("plan", plan);
      document.getElementById("title").textContent = "Welcome to Soma " + (plan === "pro" ? "Pro" : "Business") + " 🎉";
      document.getElementById("body").textContent = "Your logo, brand colors, saved clients and branding-free invoices are now unlocked on this device.";
    } else if (plan === "pack") {
      document.getElementById("title").textContent = "Your Business Kit is ready 📦";
      document.getElementById("body").textContent = "Check your email for the download link. Didn't get it within 10 minutes? Contact " + (window.SOMA_CONFIG?.supportEmail || "support") + ".";
      document.getElementById("cta").textContent = "Back to Soma";
    }
    if (window.plausible) plausible("purchase", { props: { plan } });
  </script>
</body>
</html>
